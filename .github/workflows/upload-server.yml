name: Deploy en servidor local

on:
  push:
    branches:
      - pre

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Set up environment variables
        run: |
          echo "API_URL=${{ secrets.API_URL }}" >> ${{ secrets.PROJECT_PATH }}/.env
      - name: Verificar y crear carpeta del proyecto
        run: |
          BASE_DIR="${{ secrets.PROJECT_PATH }}"

          if [ ! -d "$BASE_DIR" ]; then
            echo "📁 No existe $BASE_DIR. Creándolo..."
            mkdir -p "$BASE_DIR"
          else
            echo "✔️ Carpeta del proyecto $BASE_DIR ya existe."
          fi

      - name: Clonar o actualizar el repositorio
        run: |
          cd "${{ secrets.PROJECT_PATH }}"
          if [ -d ".git" ]; then
            git reset --hard
            git pull origin "${{ secrets.BRANCH }}"
          else
            git clone -b "${{ secrets.BRANCH }}" "${{ secrets.REPO_URL }}" .
          fi

      - name: Crear archivo de entorno
        run: |
          cat <<EOF > "${{ secrets.PROJECT_PATH }}/${{ secrets.ENV_PATH }}"
          export const environment = {
            production: ${{ secrets.ENV_PRODUCTION }},
            name: '${{ secrets.ENV_NAME }}',
            api: '${{ secrets.ENV_API }}',
            auth: '${{ secrets.ENV_AUTH }}',
            release: '${{ secrets.ENV_RELEASE }}',
            version: '${{ secrets.ENV_VERSION }}',
            pathCert: '${{ secrets.ENV_PATH_CERT }}',
            secureCookie: ${{ secrets.ENV_SECURE_COOKIE }},
            secretKeyRT: '${{ secrets.ENV_SECRET_KEY_RT }}',
            secret: '${{ secrets.ENV_SECRET }}',
            urlApp: '${{ secrets.ENV_URL_APP }}',
          };
          EOF

      - name: Verificar y detener contenedores existentes
        run: |
          cd "${{ secrets.PROJECT_PATH }}"
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ No se encontró docker-compose.yml en ${{ secrets.PROJECT_PATH }}"
            exit 1
          fi

          echo "🔍 Verificando contenedores en ejecución..."

          if docker compose ps -q | grep -q .; then
            echo "🛑 Contenedores activos detectados. Deteniéndolos..."
            docker compose down
          else
            echo "✅ No hay contenedores en ejecución."
          fi
      - name: Levantar servicios con Docker Compose
        run: |
          cd "${{ secrets.PROJECT_PATH }}"
          docker compose up -d --build
