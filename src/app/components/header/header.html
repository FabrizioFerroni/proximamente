@if(isHome){
<header class="absolute top-4 right-4 z-10">
  <app-theme />
</header>
} @else if(isAdminAndProfile) {
<header class="p-4 z-10">
  <div class="flex justify-between align-center">
    <app-enlace
      variant="ghost"
      size="sm"
      id="volver"
      href="/{{ routeBack }}"
      target="_self"
      className="rounded-md p-2 w-full cursor-pointer border border-[hsl(var(--muted))]   transition-all duration-300"
      [attr.data-tooltip]="
        isProfile ? 'Volver al tablero' : 'Volver al sistema'
      "
    >
      <lucide-icon [img]="ArrowLeft" class="w-4 h-4" />
      <span>Volver</span>
    </app-enlace>

    <div class="flex gap-5 align-center">
      <app-dropdown>
        <app-button
          (click)="toggleDropdown()"
          variant="outline"
          size="sm"
          [className]="
            'flex cursor-pointer items-center gap-2 transition-colors ' +
            (open ? 'bg-[hsl(var(--accent))]' : 'bg-transparent')
          "
        >
          <lucide-icon [img]="User" class="w-4 h-4" />
          <span class="hidden sm:inline">
            {{ user!.name }}
          </span>
          <span class="sm:hidden">{{ user!.name! }}</span>
          <lucide-icon *ngIf="!open" [img]="ChevronDown" class="w-4 h-4" />
          <lucide-icon *ngIf="open" [img]="ChevronUp" class="w-4 h-4" />
        </app-button>

        <div
          *ngIf="open"
          class="absolute top-full right-0 mt-2 border-[hsl(var(--muted))] dark:border-[hsl(var(--foreground))] z-50 min-w-[8rem] overflow-hidden rounded-md border bg-[hsl(var(--popover))] p-1 text-popover-[hsl(var(--foreground))] shadow-md"
        >
          <app-enlace
            href="/{{ profileRoute }}"
            target="_self"
            variant="ghost"
            size="sm"
            (click)="open = false"
            className="text-left relative flex cursor-pointer select-none justify-start items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0"
          >
            <lucide-icon [img]="Settings" class="w-4 h-4 mr-2" />
            Perfil
          </app-enlace>
          <app-enlace
            href="/{{ emailsRoute }}"
            target="_self"
            variant="ghost"
            size="sm"
            (click)="open = false"
            className="text-left relative flex cursor-pointer select-none justify-start items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0"
          >
            <lucide-icon [img]="Mail" class="w-4 h-4 mr-2" />
            Correos enviados
          </app-enlace>
          <div class="-mx-1 my-1 h-px bg-[hsl(var(--muted))]"></div>
          <app-button
            variant="ghost"
            size="sm"
            (click)="handleLogout(); open = false"
            className="text-left relative flex cursor-pointer select-none justify-start items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 w-full"
          >
            <lucide-icon [img]="LogOut" className="h-4 w-4 mr-2" />
            Cerrar sesión
          </app-button>
        </div>
      </app-dropdown>

      <app-theme />
    </div>
  </div>
</header>
}@else {
<header class="p-4 z-10">
  <div class="flex justify-between align-center">
    <app-enlace
      variant="ghost"
      size="sm"
      [href]="previusRoute!"
      target="_self"
      className="rounded-md p-2 w-full cursor-pointer border border-[hsl(var(--muted))]   transition-all duration-300"
      [attr.data-tooltip]="'Volver al sistema'"
    >
      <lucide-icon [img]="ArrowLeft" class="w-4 h-4" />
      <span>Volver</span>
    </app-enlace>

    <app-theme />
  </div>
</header>
}
